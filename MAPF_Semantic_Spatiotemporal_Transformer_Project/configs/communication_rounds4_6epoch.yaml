model:
  d_model: 256
  n_heads: 8
  map_layers: 1
  map_checkpoint: ../mapf-structured-map-transformer/runs/policy_exposure_structured_25_ce/best.pt
  freeze_map_encoder: true
  transformer_layers: 4
  mlp_ratio: 4
  dropout: 0.1
  use_spatial_map_fusion: true
  use_structure_bias: true

training:
  seed: 42
  batch_size: 2
  # Number of complete MAPF frames grouped per rank, not number of Ego views.
  val_batch_size: 2
  epochs: 6
  learning_rate: 0.0001
  weight_decay: 0.1
  grad_clip_norm: 1.0
  num_workers: 0
  amp: true
  output_dir: runs/sst_communication_r4_6epoch
  ego_action_weight: 1.0
  ranking_loss_weight: 0.0
  map_loss_weight: 0.0
  semantic_reconstruction_weight: 0.05
  communication_rounds: 4

data:
  kind: npz_manifest
  train_manifest: ../pogema-mapf-transformer/data/mapf_lns2_1h/train_manifest.jsonl
  val_manifest: ../pogema-mapf-transformer/data/mapf_lns2_1h/val_manifest.jsonl
  samples_per_epoch: 20000
  grouped_train_frames_per_epoch: 20000
  grouped_val_frames: 600
  goal_wait_keep_ratio: 0.2
  max_train_samples: null
  max_val_samples: 65536
  coordinate_order: row_col
  task_mode: classic
  feature_backend: cpp
