<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#18345f"/></marker>
    <style>
      .title{font:700 34px sans-serif;fill:#102a56}.head{font:700 22px sans-serif}.body{font:17px sans-serif;fill:#17212b}.small{font:15px sans-serif;fill:#44505f}.box{stroke-width:2.5;rx:16}.arrow{stroke:#18345f;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="850" fill="white"/>
  <text x="800" y="55" text-anchor="middle" class="title">MAPF Semantic Spatiotemporal Transformer</text>
  <text x="800" y="88" text-anchor="middle" class="body">25 Map + 14×8 Current + 7×4×4 History + 1 Query + 6 Messages = 256</text>

  <rect x="50" y="145" width="280" height="190" fill="#eef9f2" stroke="#2d8a57" class="box"/>
  <text x="190" y="182" text-anchor="middle" class="head" fill="#2d8a57">Structured Map</text>
  <text x="190" y="220" text-anchor="middle" class="body">17×17 → 5×5 patches</text>
  <text x="190" y="250" text-anchor="middle" class="body">25 fixed tokens</text>
  <text x="190" y="285" text-anchor="middle" class="small">9 cells + opening + edge</text>

  <rect x="370" y="125" width="330" height="230" fill="#ecf3ff" stroke="#2f67c7" class="box"/>
  <text x="535" y="165" text-anchor="middle" class="head" fill="#2f67c7">Current Agents</text>
  <text x="535" y="202" text-anchor="middle" class="body">14 agents × 8 semantic tokens</text>
  <text x="535" y="240" text-anchor="middle" class="body">P · G · R</text>
  <text x="535" y="275" text-anchor="middle" class="body">WAIT · UP · DOWN · LEFT · RIGHT</text>
  <text x="535" y="315" text-anchor="middle" class="small">Ego slot 0 + risk-based neighbors</text>

  <rect x="740" y="125" width="330" height="230" fill="#f4f0fc" stroke="#7451b8" class="box"/>
  <text x="905" y="165" text-anchor="middle" class="head" fill="#7451b8">Factual History</text>
  <text x="905" y="202" text-anchor="middle" class="body">7 tracks × 4 lags × 4 tokens</text>
  <text x="905" y="240" text-anchor="middle" class="body">Pᵗ · Gᵗ · Rᵗ · AOᵗ</text>
  <text x="905" y="280" text-anchor="middle" class="small">No Recent/Trend pooling</text>
  <text x="905" y="310" text-anchor="middle" class="small">No past candidate expansion</text>

  <rect x="1110" y="125" width="300" height="230" fill="#f3f5f7" stroke="#5a6472" class="box"/>
  <text x="1260" y="165" text-anchor="middle" class="head" fill="#5a6472">Coordination Slots</text>
  <text x="1260" y="207" text-anchor="middle" class="body">Baseline: 7 masked</text>
  <text x="1260" y="245" text-anchor="middle" class="body">Optional: 1 message query</text>
  <text x="1260" y="278" text-anchor="middle" class="body">+ 6 neighbor messages</text>
  <text x="1260" y="318" text-anchor="middle" class="small">Explicit cross-view communication</text>

  <path d="M330 240 L370 240" class="arrow"/><path d="M700 240 L740 240" class="arrow"/><path d="M1070 240 L1110 240" class="arrow"/>

  <rect x="250" y="430" width="1100" height="170" fill="#fff7e9" stroke="#c77a17" class="box"/>
  <text x="800" y="472" text-anchor="middle" class="head" fill="#c77a17">Structured Spatiotemporal Transformer</text>
  <text x="800" y="510" text-anchor="middle" class="body">Candidate source/target routing + sparse local map attention</text>
  <text x="800" y="545" text-anchor="middle" class="body">field · time · same-agent · same-track · vertex · edge-swap · corridor biases</text>
  <text x="800" y="578" text-anchor="middle" class="small">Bidirectional encoder; no causal mask; padding and invalid actions are masked</text>
  <path d="M800 355 L800 430" class="arrow"/>

  <rect x="370" y="675" width="360" height="105" fill="#ecf3ff" stroke="#2f67c7" class="box"/>
  <text x="550" y="712" text-anchor="middle" class="head" fill="#2f67c7">Ego Candidate Scoring</text>
  <text x="550" y="748" text-anchor="middle" class="body">5 fixed candidate outputs → logits</text>
  <path d="M630 600 L550 675" class="arrow"/>

  <rect x="870" y="675" width="360" height="105" fill="#eef9f2" stroke="#2d8a57" class="box"/>
  <text x="1050" y="712" text-anchor="middle" class="head" fill="#2d8a57">Action Preference</text>
  <text x="1050" y="748" text-anchor="middle" class="body">softmax [WAIT, UP, DOWN, LEFT, RIGHT]</text>
  <path d="M730 727 L870 727" class="arrow"/>
</svg>
