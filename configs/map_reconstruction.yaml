model:
  halo_size: 17
  core_size: 15
  patch_size: 3
  num_cell_states: 2
  free_state: 0
  occupied_state: 1
  unknown_state: null
  d_model: 256
  patch_hidden_dim: 256
  num_heads: 8
  num_layers: 1
  ffn_multiplier: 4
  dropout: 0.1
  position_encoding: learned
  use_center_embedding: true
  use_relative_position_bias: true
  use_connectivity_bias: true
  include_port_openings: true
  include_outer_edge_mask: true
  include_port_known_mask: false
  final_norm: true
  reconstruct_ports: false

loss:
  bce_weight: 1.0
  dice_weight: 0.5
  port_weight: 0.0
  occupied_pos_weight: 2.0
  boundary_pixel_weight: 2.0
  eps: 1.0e-6

dataset:
  kind: synthetic
  train_path: null
  val_path: null
  train_samples: 20000
  val_samples: 2000
  seed: 7
  min_density: 0.08
  max_density: 0.38
  pattern_mix: [bernoulli, walls, rooms, corridors, mixed]
  ensure_center_free: true

training:
  output_dir: runs/map_reconstruction
  epochs: 30
  batch_size: 128
  val_batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_steps: 200
  max_steps: null
  grad_clip_norm: 1.0
  num_workers: 0
  device: auto
  amp: true
  seed: 42
  log_interval: 20
  eval_interval_epochs: 1
  checkpoint_interval_epochs: 1
  save_visualizations: 8
