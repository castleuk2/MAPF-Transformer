model:
  d_model: 256
  n_heads: 8
  map_layers: 1
  coordination_layers: 4
  history_layers: 1
  mlp_ratio: 4
  dropout: 0.1
  enable_map_reconstruction: true
  enable_reason_head: true
  enable_conflict_head: true
  enable_scene_risk_head: true
  map_checkpoint: checkpoints/structured_map_policy_exposure_best.pt
  freeze_map_encoder: true

training:
  seed: 42
  batch_size: 256
  val_batch_size: 256
  gradient_accumulation_steps: 1
  epochs: 6
  max_steps: null
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  use_scheduler: true
  grad_clip_norm: 1.0
  num_workers: 12
  amp: true
  output_dir: runs/mpct_lns2_150m_jit_yield_v2_auto_6epoch
  ego_action_weight: 1.0
  neighbor_action_weight: 0.35
  act_request_weight: 0.5
  map_loss_weight: 0.02
  conflict_loss_weight: 0.10
  reason_loss_weight: 0.10
  scene_risk_loss_weight: 0.05

data:
  kind: hybrid_selected
  hybrid_train_manifest: ../pogema-mapf-transformer/data/mapf_lns2_150m_jit_yield_v2_packed/train/manifest.jsonl
  val_manifest: ../pogema-mapf-transformer/data/mapf_lns2_150m_jit_yield_v2_packed/val/manifest.jsonl
  coordinate_order: row_col
  task_mode: one_shot
  target_mode: stay
  goal_wait_keep_ratio: 0.2
  max_train_samples: null
  max_val_samples: null
