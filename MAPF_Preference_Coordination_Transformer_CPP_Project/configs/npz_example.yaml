model:
  d_model: 256
  n_heads: 8
  map_layers: 1
  coordination_layers: 4
  history_layers: 1
  dropout: 0.1
  map_checkpoint: checkpoints/structured_map_policy_exposure_best.pt
  freeze_map_encoder: true

training:
  seed: 42
  batch_size: 8
  epochs: 20
  learning_rate: 0.0003
  output_dir: runs/npz_expert

data:
  kind: npz_manifest
  train_manifest: /path/to/train_manifest.jsonl
  val_manifest: /path/to/val_manifest.jsonl
  samples_per_epoch: 20000
  val_samples: 2000
  coordinate_order: row_col
  task_mode: one_shot
  target_mode: stay
