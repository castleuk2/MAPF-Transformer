model:
  d_model: 64
  n_heads: 4
  map_layers: 1
  coordination_layers: 2
  history_layers: 1
  mlp_ratio: 2
  dropout: 0.0

training:
  seed: 42
  batch_size: 2
  epochs: 1
  max_steps: 2
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  num_workers: 0
  amp: false
  output_dir: runs/tiny

data:
  kind: synthetic
  train_samples: 8
  val_samples: 4
