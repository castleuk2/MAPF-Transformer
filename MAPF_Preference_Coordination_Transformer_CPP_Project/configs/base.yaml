model:
  d_model: 256
  n_heads: 8
  map_layers: 1
  coordination_layers: 4
  history_layers: 1
  mlp_ratio: 4
  dropout: 0.1
  enable_map_reconstruction: true
  enable_reason_head: true
  enable_conflict_head: true
  enable_scene_risk_head: true
  map_checkpoint: checkpoints/structured_map_policy_exposure_best.pt
  freeze_map_encoder: true

training:
  seed: 42
  batch_size: 16
  epochs: 20
  max_steps: null
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip_norm: 1.0
  num_workers: 0
  amp: true
  output_dir: runs/base
  ego_action_weight: 1.0
  neighbor_action_weight: 0.35
  act_request_weight: 0.5
  map_loss_weight: 0.02
  conflict_loss_weight: 0.10
  reason_loss_weight: 0.10
  scene_risk_loss_weight: 0.05

data:
  kind: synthetic
  train_samples: 4096
  val_samples: 512
  coordinate_order: row_col
  task_mode: one_shot
  target_mode: stay
